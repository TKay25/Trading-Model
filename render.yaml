services:
  - type: web
    name: trading-dashboard
    runtime: python
    repo: https://github.com/yourusername/your-repo-name
    plan: free
    # Frankfurt (EU) instead of oregon (US): Deriv throttles/ignores requests
    # from Render's Oregon datacenter IPs (connect succeeds, responses time out).
    # EU datacenters usually have better/more trusted connectivity to Deriv.
    region: frankfurt
    # Pin to Python 3.12: Python 3.14 removed the stdlib "idna" codec that older
    # Werkzeug relied on (LookupError: unknown encoding: idna -> 500 on every
    # request). 3.12 + Werkzeug 3.1.8 is the verified-stable combo. If deploying
    # from the Render DASHBOARD (not a blueprint), set the same version there.
    pythonVersion: "3.12.7"
    buildCommand: pip install -r requirements.txt
    # Single gthread worker: the app runs background singletons (live stream,
    # balance stream, SL/TP position monitor) — multiple workers would duplicate
    # them (2 live streams, 2 position monitors racing to close the same trade).
    # gthread threads handle the long-lived SSE streams + concurrent API calls
    # without a sync worker ever being blocked. High --timeout lets the 25s
    # _deriv_call wait_for return a clean 500 instead of tripping a worker kill.
    startCommand: gunicorn app:app --workers 1 --threads 16 --worker-class gthread --timeout 120 --graceful-timeout 30 --keep-alive 5 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_ACCOUNT_TYPE
        value: demo
      - key: DEFAULT_SYMBOL
        value: R_75
      - key: DEFAULT_TIMEFRAME
        value: 5m
