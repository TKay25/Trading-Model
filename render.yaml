services:
  - type: web
    name: trading-dashboard
    runtime: python
    repo: https://github.com/yourusername/your-repo-name
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Single gthread worker: the app runs background singletons (live stream,
    # balance stream, SL/TP position monitor) — multiple workers would duplicate
    # them (2 live streams, 2 position monitors racing to close the same trade).
    # gthread threads handle the long-lived SSE streams + concurrent API calls
    # without a sync worker ever being blocked. High --timeout lets the 25s
    # _deriv_call wait_for return a clean 500 instead of tripping a worker kill.
    startCommand: gunicorn app:app --workers 1 --threads 16 --worker-class gthread --timeout 120 --graceful-timeout 30 --keep-alive 5 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_ACCOUNT_TYPE
        value: demo
      - key: DEFAULT_SYMBOL
        value: R_75
      - key: DEFAULT_TIMEFRAME
        value: 5m
