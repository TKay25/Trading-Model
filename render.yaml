services:
  - type: web
    name: trading-dashboard
    runtime: python
    repo: https://github.com/yourusername/your-repo-name
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 8 --worker-class gthread --timeout 120 --graceful-timeout 30 --keep-alive 5 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_ACCOUNT_TYPE
        value: demo
      - key: DEFAULT_SYMBOL
        value: R_75
      - key: DEFAULT_TIMEFRAME
        value: 5m
