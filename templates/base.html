<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading Dashboard{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="topbar">
        <div class="topbar-inner">
            <div class="topbar-left">
                <div class="topbar-brand">
                    <span class="brand-icon"><i class="bi bi-graph-up"></i></span>
                    <span class="brand-text">TradeVue</span>
                </div>
                <div class="topbar-nav">
                    <a href="/" class="topbar-link active">Dashboard</a>
                </div>
            </div>
            <div class="topbar-right">
                <span id="connectionStatus" class="status-badge status-offline">
                    <span class="status-dot"></span> Disconnected
                </span>
                <span id="accountBalance" class="status-balance d-none">
                    <span class="balance-label">Balance</span>
                    <span class="balance-value">$<span id="balanceValue">0.00</span></span>
                </span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart Library -->
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Main App JS -->
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    <script src="{{ url_for('static', filename='js/indicators.js') }}"></script>
    <script src="{{ url_for('static', filename='js/trading.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
